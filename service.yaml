apiVersion: v1
kind: Service
metadata:
  name: foreshy-app-service
  labels:
    app: foreshy
spec:
  type: LoadBalancer
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  selector:
    app: foreshy
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 3000