apiVersion: apps/v1
kind: Deployment
metadata:
  name: foreshy-app-deployment
  labels:
    app: foreshy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: foreshy
  template:
    metadata:
      labels:
        app: foreshy
    spec:
      containers:
      - name: foreshy-container
        image: dakyong/foreshy-app:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000

        startupProbe:
          httpGet:
            path: /health
            port: 3000
          periodSeconds: 10
          failureThreshold: 30

        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        - name: DB_HOST
          value: "10.178.0.6"
        - name: DB_PORT
          value: "3306"
        - name: DB_USER
          value: "foreshy_user"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: foreshy-secret
              key: DB_PASSWORD
        - name: DB_NAME
          value: "foreshy_db"
        - name: SESSION_SECRET
          valueFrom:
            secretKeyRef:
              name: foreshy-secret
              key: SESSION_SECRET
        - name: GROQ_API_KEY
          valueFrom:
            secretKeyRef:
              name: foreshy-secret
              key: GROQ_API_KEY
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: foreshy-secret
              key: GEMINI_API_KEY
        - name: GEMINI_API_KEY_2
          valueFrom:
            secretKeyRef:
              name: foreshy-secret
              key: GEMINI_API_KEY_2
        - name: GEMINI_API_KEY_3
          valueFrom:
            secretKeyRef:
              name: foreshy-secret
              key: GEMINI_API_KEY_3
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: "./google_ocr_key.json"
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        volumeMounts:
        - name: ocr-key
          mountPath: /usr/src/app/google_ocr_key.json
          subPath: google_ocr_key.json
          readOnly: true
      volumes:
      - name: ocr-key
        secret:
          secretName: foreshy-secret
          items:
          - key: google_ocr_key.json
            path: google_ocr_key.json
